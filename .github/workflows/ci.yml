name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # shared/ is the ShowTrak-Protocol submodule; without it the
          # @showtrak/protocol path mapping resolves to an empty directory.
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test (${{ matrix.os }})
    # Every platform the app ships on. The Windows and macOS code paths (audio
    # shims, device readers, route tables, the updater) otherwise run for the
    # first time on a user's machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A leaked handle in a test used to hang `npm test` until GitHub's 6-hour
    # default killed it, so cap the job well below that: a stuck run should be a
    # red X in minutes. Windows runners are markedly slower, hence the headroom.
    timeout-minutes: 25

    steps:
      # Windows runners check out with CRLF line endings by default, which would
      # make every test that reads a fixture or a source file see different
      # bytes than the other two platforms.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # pretest runs the full build, so this also covers `npm run build`.
      - name: Test
        run: npm test
